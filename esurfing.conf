# ===========================================================================
#  广东天翼校园网 (cdcportal) 客户端配置
# ---------------------------------------------------------------------------
#  带 <尖括号> 或 x 的都是占位符，必须换成你所在学校的实际值，脚本不会猜。
#
#  查找顺序（先找到的生效）：
#    Linux   : /etc/esurfing.conf -> ~/.config/esurfing.conf -> 脚本目录/esurfing.conf
#    Windows : %LOCALAPPDATA%\esurfing\esurfing.conf -> 脚本目录\esurfing.conf
#
#  也就是说：仓库里这份是占位符模板；你本地的真实值放在系统位置（上面两个路径），
#  不要改这份、更不要把它提交上去。
# ===========================================================================

# ---- 账号 ----
user=
passwd=

# ---- 网卡 ----
# Linux: wlan0 / eno1 等；Windows: auto / WLAN / 接口索引 / 描述子串
iface=
# 通道：windows / linux / android / macos / ios
channel=windows

# ---- 本校区接入参数（占位符，必须改）----
# 校园 WiFi 的 SSID（脚本不用它，你连网时用；写在这里方便替换文档里的真名）
ssid=<你的校园网SSID>

# 认证服务器（BRAS / 门户），逗号分隔，按顺序尝试
servers=<认证服务器IP>,<备用认证服务器IP>

# 门户端口（多数是 7001）
port=7001

# 认证器（AC）地址；探测不到时会用这个兜底，可以留空
acip=<AC地址>

# 天翼地址池：只有本机地址落在这个网段里才去认证
campus_net=<天翼地址池网段>

# 学校自己的准入网：落在这里说明本机 MAC 还没登记
eia_net=<学校准入网网段>

# 准入网的登录页，脚本会把这个地址打给你（必须 http://，别用 https）
eia_portal=http://<准入网网关>

# ---- 学校参数（多数学校可留空）----
schoolid=
domain=
area=

# ---- 其它 ----
# 心跳间隔下限（秒）
interval_min=20
# 心跳之外每 N 秒真连一次外网校验（Windows 版用，0=关闭）
net_check=300
